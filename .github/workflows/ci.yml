name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (WeasyPrint + Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi-dev libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu
      - name: Install Python dependencies
        run: pip install "pyside6>=6.7,<6.12" "weasyprint>=69.0"
      - name: Run the test suite (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          LABDESK_DATA_DIR: /tmp/ci_data
        run: python tests/test_all.py
