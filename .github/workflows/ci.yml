name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Qt treated as untyped (ignore_missing_imports) — see [tool.mypy].
        run: pip install "mypy>=1.13"
      - name: Type check
        run: mypy src/labdesk

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu
      - name: Install Python dependencies
        run: pip install "pyside6>=6.7,<6.12"
      - name: Run the test suite (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          LABDESK_DATA_DIR: /tmp/ci_data
        run: python tests/test_all.py
